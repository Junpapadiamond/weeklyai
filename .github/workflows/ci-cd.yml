# WeeklyAI CI/CD Pipeline
# 
# 触发条件:
#   - push 到 main 分支
#   - 手动触发
#
# 功能:
#   1. 构建 Docker 镜像
#   2. 推送到 GitHub Container Registry
#   3. 部署到服务器 (可选)
#   4. 手动运行爬虫更新数据

name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_crawler:
        description: 'Run crawler to update data'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: weeklyai

jobs:
  # ============================================
  # 构建和测试
  # ============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.run_crawler != 'true'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image prefix (lowercase)
        id: image_meta
        run: |
          echo "prefix=$(echo '${{ github.repository_owner }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.prefix }}-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.prefix }}-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Crawler
        uses: docker/build-push-action@v5
        with:
          context: .
          file: crawler/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.prefix }}-crawler:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # 推送镜像到 Registry
  # ============================================
  push:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image prefix (lowercase)
        id: image_meta
        run: |
          echo "prefix=$(echo '${{ github.repository_owner }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.prefix }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.prefix }}-frontend:latest
            ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.prefix }}-backend:latest
            ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push Crawler
        uses: docker/build-push-action@v5
        with:
          context: .
          file: crawler/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.prefix }}-crawler:latest
            ${{ env.REGISTRY }}/${{ steps.image_meta.outputs.prefix }}-crawler:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # 定时爬虫任务
  # ============================================
  crawler:
    name: Run Crawler
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_crawler == 'true'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'crawler/requirements.txt'

      - name: Install dependencies
        run: |
          cd crawler
          pip install -r requirements.txt

      - name: Run crawler
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          cd crawler
          python tools/auto_discover.py --region all --type mixed --dry-run
          # 如果测试通过，运行实际爬取
          # python tools/auto_discover.py --region all --type mixed

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawler-data-${{ github.run_number }}
          path: crawler/data/
          retention-days: 7

  # ============================================
  # 部署到服务器 (可选)
  # ============================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Deploy to server
        run: |
          echo "🚀 Deployment step"
          echo "Configure your deployment here:"
          echo "  - SSH to server and docker-compose pull"
          echo "  - Or use Railway/Render/Fly.io webhooks"
          echo "  - Or trigger Kubernetes deployment"
