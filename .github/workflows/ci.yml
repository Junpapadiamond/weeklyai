name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Next.js production checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  backend:
    name: API and discovery regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend:crawler
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r backend/requirements.txt -r crawler/requirements.txt pytest
      - run: python -m pytest -q tests --ignore=tests/test_frontend.py
      - name: Check bundled product and news snapshots
        run: |
          cmp crawler/data/products_featured.json backend/data/products_featured.json
          cmp crawler/data/blogs_news.json backend/data/blogs_news.json
          cmp crawler/data/last_updated.json backend/data/last_updated.json
          cmp crawler/data/product_legacy_ids.json backend/data/product_legacy_ids.json
