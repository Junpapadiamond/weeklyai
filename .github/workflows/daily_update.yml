name: Daily Data Update

on:
  schedule:
    # 19:00 UTC = 03:00 Asia/Shanghai (next day). GitHub cron is always UTC.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install crawler deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r crawler/requirements.txt
          python -m pip install -r backend/requirements.txt

      - name: Run discovery + news
        timeout-minutes: 18
        env:
          DISCOVERY_PROVIDER: ${{ vars.DISCOVERY_PROVIDER || 'claude' }}
          DISCOVERY_SEARCH_PROVIDER: ${{ vars.DISCOVERY_SEARCH_PROVIDER || 'rss' }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_API_BASE_URL: ${{ vars.CLAUDE_API_BASE_URL || 'https://api.intenext.ai/v1' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          CLAUDE_DISCOVERY_MAX_CALLS: '6'
          CLAUDE_DISCOVERY_MAX_ARTICLES: '12'
          PERPLEXITY_API_KEY: ${{ (vars.DISCOVERY_PROVIDER || 'claude') != 'claude' && secrets.PERPLEXITY_API_KEY || '' }}
          PERPLEXITY_MODEL: ${{ secrets.PERPLEXITY_MODEL || 'sonar' }}
          ZHIPU_API_KEY: ${{ (vars.DISCOVERY_PROVIDER || 'claude') != 'claude' && secrets.ZHIPU_API_KEY || '' }}
          GLM_MODEL: ${{ secrets.GLM_MODEL || 'glm-4.7' }}
          GLM_SEARCH_ENGINE: ${{ secrets.GLM_SEARCH_ENGINE || 'search_pro' }}
          USE_GLM_FOR_CN: ${{ secrets.ZHIPU_API_KEY && 'true' || 'false' }}
        working-directory: crawler
        run: |
          set -euo pipefail
          export CONTENT_YEAR="$(date -u +%Y)"

          python tools/check_providers.py --live
          python tools/auto_discover.py --region all --require-results
          # Sanity prune weekly dark horses (avoid headline-like items).
          python tools/prune_dark_horses.py
          python tools/auto_publish.py

          # Claude already validates dated evidence, official-site identity and
          # deduplication. Do not re-probe the entire legacy catalog (or clear
          # existing logos) before publishing the newly verified products.
          if [ "${DISCOVERY_PROVIDER}" != "claude" ]; then
            timeout 90s python tools/backfill_source_urls.py || true
            timeout 90s python tools/resolve_websites.py --input data/products_featured.json --aggressive || true
            timeout 120s python tools/validate_websites.py --scope auto || true
            python tools/cleanup_unknowns_and_duplicates.py || true
          fi
          timeout 120s python -u tools/fix_logos.py --input data/products_featured.json --only-missing || true

          BASELINE_BLOGS="/tmp/blogs_news.before_news.json"
          if [ -f data/blogs_news.json ]; then
            cp -f data/blogs_news.json "$BASELINE_BLOGS"
          fi

          timeout 180s python -u main.py --news-only || true
          # A news outage must not discard verified product discoveries. Keep
          # the previous multilingual news snapshot if the merge cannot finish.
          if ! timeout 120s python -u tools/cn_news_only.py --baseline-file "$BASELINE_BLOGS"; then
            if [ -f "$BASELINE_BLOGS" ]; then cp -f "$BASELINE_BLOGS" data/blogs_news.json; fi
            echo "News refresh deferred; retained previous snapshot. Product publication continues." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${DISCOVERY_PROVIDER}" != "claude" ] && ! timeout 120s python -u tools/cn_news_glm.py; then
            echo "❌ CN merge failed: cn_news_glm.py" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${DISCOVERY_PROVIDER}" != "claude" ]; then
            timeout 120s python tools/rss_to_products.py --input data/blogs_news.json --sources youtube,x,xhs,wechat --enrich-featured || true
          fi

      - name: Verify JSON data sources (deterministic)
        timeout-minutes: 2
        continue-on-error: true
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          PERPLEXITY_MODEL: ${{ secrets.PERPLEXITY_MODEL || 'sonar' }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_MODEL: ${{ secrets.GLM_MODEL || 'glm-4.7' }}
          GLM_SEARCH_ENGINE: ${{ secrets.GLM_SEARCH_ENGINE || 'search_pro' }}
          USE_GLM_FOR_CN: ${{ secrets.ZHIPU_API_KEY && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python crawler/tools/verify_data_sources.py \
            --mode heuristic \
            --check-network none \
            --skip-backend-snapshot-check \
            --report-json /tmp/data_report.json \
            --report-md /tmp/data_report.md

      - name: Publish verification summary
        if: always()
        run: |
          if [ -f /tmp/data_report.md ]; then
            cat /tmp/data_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No verification report markdown found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weeklyai-data-report-${{ github.run_number }}
          path: |
            /tmp/data_report.json
            /tmp/data_report.md
            crawler/logs/discovery/*.json

      - name: Sync snapshot for backend deployment
        run: |
          set -euo pipefail
          mkdir -p backend/data/dark_horses

          cp -f crawler/data/products_featured.json backend/data/products_featured.json
          cp -f crawler/data/product_legacy_ids.json backend/data/product_legacy_ids.json
          cp -f crawler/data/blogs_news.json backend/data/blogs_news.json
          cp -f crawler/data/industry_leaders.json backend/data/industry_leaders.json
          cp -f crawler/data/last_updated.json backend/data/last_updated.json

          # Keep curated weekly files in sync.
          rsync -a crawler/data/dark_horses/ backend/data/dark_horses/
          mkdir -p backend/data/demos/published
          rsync -a crawler/data/demos/published/ backend/data/demos/published/

      - name: Prepare dark-horse interactive experiences
        continue-on-error: true
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'weeklyai' }}
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
          DEMO_API_BASE_URL: ${{ vars.DEMO_API_BASE_URL || 'https://api.intenext.ai/v1' }}
          DEMO_MODEL: ${{ vars.DEMO_MODEL || 'claude-sonnet-5' }}
          DEMO_API_PROTOCOL: ${{ vars.DEMO_API_PROTOCOL || 'anthropic' }}
          DEMO_DAILY_GLOBAL_LIMIT: ${{ vars.DEMO_DAILY_GLOBAL_LIMIT || '20' }}
        run: python crawler/tools/pregenerate_demos.py --limit 5 --snapshot crawler/data/products_featured.json

      - name: Commit and push (if changed)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            crawler/data/products_featured.json \
            crawler/data/blogs_news.json \
            crawler/data/last_updated.json \
            crawler/data/dark_horses \
            crawler/data/rising_stars \
            crawler/data/demos \
            backend/data/demos \
            backend/data/products_featured.json \
            backend/data/product_legacy_ids.json \
            backend/data/blogs_news.json \
            backend/data/industry_leaders.json \
            backend/data/last_updated.json \
            backend/data/dark_horses

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore(data): daily update"

          # Some best-effort steps may touch additional tracked files (e.g. candidates cache).
          # Keep the working tree clean so `git pull --rebase` won't fail.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree dirty after commit; stashing leftovers before rebase/push."
            git stash push -u -m "ci-autostash-before-push" || true
          fi

          pushed="false"
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            if git pull --rebase origin main && git push; then
              pushed="true"
              break
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done

          if [ "$pushed" != "true" ]; then
            echo "❌ Push failed after retries (non-fast-forward or rebase conflict)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Sync published snapshot to MongoDB (when configured)
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'weeklyai' }}
        run: |
          set -euo pipefail
          if [ -z "$MONGO_URI" ]; then
            echo "MongoDB sync skipped: MONGO_URI is not configured; Vercel uses the committed snapshot." >> "$GITHUB_STEP_SUMMARY"
          else
            python crawler/tools/sync_to_mongodb.py --blogs --demos
          fi
